name: Build & Testnet Deploy Workflow

on:
  push:
    branches: [ master, god-mode-production-hardening ]
  pull_request:
    branches: [ master, god-mode-production-hardening ]

jobs:
  build-and-test:
    name: Build & Verify Quantum Multichain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # package-lock.json predates @noble/post-quantum. npm ci therefore fails
      # before the PQC tests can run. Regenerate/install from package.json in CI.
      - name: Install Dependencies (repair lock mismatch)
        run: npm install --no-audit --no-fund

      - name: Run PQC Reality Test
        run: npm run test:pqc

      - name: Run Type Check & Lint
        run: npm run lint

      - name: Build Fullstack Web 4.0 Distribution
        run: npm run build

      - name: Test Automated Testnet Deployments
        run: node scripts/deploy-testnet.cjs

      - name: Test Multichain Network Registry
        run: node scripts/deploy-multichain.cjs

      - name: Upload Deployment Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testnet-deployments
          path: |
            testnet-deployments.json
            deployments.json
