name: PQC Implementation Gate
on:
  push:
    branches: [god-mode-production-hardening]
  pull_request:
jobs:
  pqc-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:pqc
