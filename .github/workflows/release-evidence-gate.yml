name: Release Evidence Gate
on:
  push:
    branches: [god-mode-production-hardening]
  pull_request:
jobs:
  release-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/release-evidence-gate.cjs
